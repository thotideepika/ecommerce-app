server:
  port: 8080

spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/ecommerce
    username: postgres
    password: postgres
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
  sql:
    init:
      mode: never

jwt:
  secret: mySuperSecretKeyForEcommerceAppThatIsLongEnough1234567890
  expiration: 86400000

file:
  upload-dir: uploads/
  logging:
  level:
    org.springframework.security: TRACE
    org.springframework.web: DEBUG
    com.ecommerce: DEBUG
  